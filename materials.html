<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Materials — Goke Couture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --ink: #0A0A0A;
      --ivory: #F5F0E8;
      --gold: #C9A84C;
      --gold-lt: #E8D48A;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Jost', system-ui, sans-serif;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; font-size:16px; }
    body { background:var(--ink); color:var(--ivory); font-family:var(--font-body); font-weight:300; }
    a { text-decoration:none; color:inherit; }
    button { border:none; background:none; font-family:inherit; cursor:pointer; }
    img { display:block; max-width:100%; }

    .container { max-width:1200px; margin:0 auto; padding:2rem 1.5rem; }
    .header { display:flex; justify-content:space-between; align-items:center; padding-bottom:1.5rem; border-bottom:1px solid rgba(201,168,76,.15); margin-bottom:2rem; }
    .header h1 { font-family:var(--font-display); font-size:2rem; font-weight:300; }
    .header h1 em { color:var(--gold); font-style:italic; }
    .header .back-btn { font-size:.8rem; color:rgba(245,240,232,.5); transition:color .3s; }
    .header .back-btn:hover { color:var(--gold); }

    .material-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:1.5rem; margin:2rem 0; }
    .material-card { background:#111; border:1px solid rgba(245,240,232,.06); border-radius:6px; overflow:hidden; transition:border-color .3s; }
    .material-card:hover { border-color:rgba(201,168,76,.3); }
    .material-card .image { height:200px; background:#1a1a1a; overflow:hidden; }
    .material-card .image img { width:100%; height:100%; object-fit:cover; }
    .material-card .info { padding:1rem; }
    .material-card .info h3 { font-family:var(--font-display); font-size:1.2rem; font-weight:400; color:var(--ivory); }
    .material-card .info .price { color:var(--gold); font-weight:400; font-size:1rem; margin:.2rem 0 .4rem; }
    .material-card .info .desc { font-size:.8rem; color:rgba(245,240,232,.5); margin-bottom:.6rem; }
    .material-card .info .qty-control { display:flex; align-items:center; gap:.6rem; }
    .material-card .info .qty-control button { width:28px; height:28px; border-radius:50%; background:rgba(201,168,76,.1); color:var(--gold); border:1px solid rgba(201,168,76,.2); font-size:1rem; transition:background .3s; }
    .material-card .info .qty-control button:hover { background:rgba(201,168,76,.2); }
    .material-card .info .qty-control .qty { width:40px; text-align:center; font-size:1rem; background:transparent; border:none; color:var(--ivory); outline:none; }
    .material-card .info .qty-control .qty::-webkit-inner-spin-button { -webkit-appearance:none; }

    .summary-bar { position:sticky; bottom:0; background:#0f0f0f; border-top:1px solid rgba(201,168,76,.15); padding:1rem 1.5rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
    .summary-bar .total { font-size:1.2rem; }
    .summary-bar .total span { color:var(--gold); font-weight:400; }
    .btn-primary { background:var(--gold); color:var(--ink); padding:.7rem 2rem; font-size:.8rem; letter-spacing:.15em; text-transform:uppercase; transition:background .3s; border:none; border-radius:4px; }
    .btn-primary:hover { background:var(--gold-lt); }
    .btn-ghost { background:transparent; border:1px solid rgba(245,240,232,.3); color:var(--ivory); padding:.7rem 2rem; font-size:.8rem; letter-spacing:.15em; text-transform:uppercase; transition:border-color .3s; border-radius:4px; }
    .btn-ghost:hover { border-color:var(--gold); }

    .loading-state { text-align:center; padding:4rem 0; color:rgba(245,240,232,.3); }
    .empty-state { text-align:center; padding:4rem 0; color:rgba(245,240,232,.3); }

    @media(max-width:768px) {
      .material-grid { grid-template-columns:1fr 1fr; }
      .summary-bar { flex-direction:column; align-items:stretch; text-align:center; }
    }
    @media(max-width:480px) {
      .material-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Select <em>Materials</em></h1>
      <a href="booking.html" class="back-btn"><i class="fas fa-arrow-left"></i> Return to Booking</a>
    </div>

    <div id="materialsContainer">
      <div class="loading-state"><i class="fas fa-spinner fa-spin"></i> Loading materials...</div>
    </div>

    <div class="summary-bar" id="summaryBar">
      <div class="total">Total: <span id="totalPrice">₦0</span></div>
      <div style="display:flex; gap:.6rem;">
        <button class="btn-ghost" id="clearAllBtn">Clear All</button>
        <button class="btn-primary" id="returnBtn">Return to Booking</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
    // ── Firebase Config ──
    const firebaseConfig = {
      apiKey: "AIzaSyCFc0oxzA8oPO-Z0EN0YwL7-n7GbdnEElQ",
      authDomain: "gokecouture-26a61.firebaseapp.com",
      databaseURL: "https://gokecouture-26a61-default-rtdb.firebaseio.com",
      projectId: "gokecouture-26a61",
      storageBucket: "gokecouture-26a61.firebasestorage.app",
      messagingSenderId: "527866719903",
      appId: "1:527866719903:web:c3bb9997ecde72cac43caa"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ── State ──
    let materials = [];
    let selections = {}; // { materialId: quantity }

    const container = document.getElementById('materialsContainer');
    const totalPriceSpan = document.getElementById('totalPrice');
    const returnBtn = document.getElementById('returnBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');

    // ── Load materials ──
    function loadMaterials() {
      container.innerHTML = '<div class="loading-state"><i class="fas fa-spinner fa-spin"></i> Loading materials...</div>';
      db.ref('materials').once('value')
        .then(snapshot => {
          const data = snapshot.val();
          if (!data) {
            container.innerHTML = '<div class="empty-state">No materials available.</div>';
            return;
          }
          materials = Object.keys(data).map(key => {
            const item = data[key];
            return {
              id: key,
              name: item.name || 'Unnamed',
              price: item.price || 0,
              image: item.image || 'https://placehold.co/400x300/222/555?text=No+Image',
              description: item.description || ''
            };
          });
          // Load previous selections from localStorage if any
          const saved = localStorage.getItem('materialSelections');
          if (saved) {
            try {
              selections = JSON.parse(saved);
            } catch(e) { selections = {}; }
          }
          renderMaterials();
          updateTotal();
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = '<div class="empty-state">Error loading materials. Please try again.</div>';
        });
    }

    // ── Render ──
    function renderMaterials() {
      let html = '<div class="material-grid">';
      materials.forEach(mat => {
        const qty = selections[mat.id] || 0;
        html += `
          <div class="material-card" data-id="${mat.id}">
            <div class="image">
              <img src="${mat.image}" alt="${mat.name}" onerror="this.src='https://placehold.co/400x300/222/555?text=No+Image'" />
            </div>
            <div class="info">
              <h3>${mat.name}</h3>
              <div class="price">₦${mat.price.toLocaleString()} / unit</div>
              <div class="desc">${mat.description || ''}</div>
              <div class="qty-control">
                <button class="qty-minus" data-id="${mat.id}">−</button>
                <input type="number" class="qty" value="${qty}" min="0" step="1" data-id="${mat.id}" />
                <button class="qty-plus" data-id="${mat.id}">+</button>
              </div>
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;

      // Attach events
      container.querySelectorAll('.qty-minus').forEach(btn => {
        btn.addEventListener('click', function() {
          const id = this.dataset.id;
          const input = this.parentElement.querySelector('.qty');
          let val = parseInt(input.value) || 0;
          if (val > 0) val--;
          input.value = val;
          updateSelection(id, val);
        });
      });
      container.querySelectorAll('.qty-plus').forEach(btn => {
        btn.addEventListener('click', function() {
          const id = this.dataset.id;
          const input = this.parentElement.querySelector('.qty');
          let val = parseInt(input.value) || 0;
          val++;
          input.value = val;
          updateSelection(id, val);
        });
      });
      container.querySelectorAll('.qty').forEach(input => {
        input.addEventListener('change', function() {
          const id = this.dataset.id;
          let val = parseInt(this.value) || 0;
          if (val < 0) val = 0;
          this.value = val;
          updateSelection(id, val);
        });
      });
    }

    // ── Update selection ──
    function updateSelection(id, qty) {
      if (qty <= 0) {
        delete selections[id];
      } else {
        selections[id] = qty;
      }
      localStorage.setItem('materialSelections', JSON.stringify(selections));
      updateTotal();
    }

    // ── Update total ──
    function updateTotal() {
      let total = 0;
      materials.forEach(mat => {
        const qty = selections[mat.id] || 0;
        total += mat.price * qty;
      });
      totalPriceSpan.textContent = '₦' + total.toLocaleString();
    }

    // ── Clear all ──
    clearAllBtn.addEventListener('click', function() {
      selections = {};
      localStorage.setItem('materialSelections', JSON.stringify(selections));
      renderMaterials();
      updateTotal();
    });

    // ── Return to Booking ──
    returnBtn.addEventListener('click', function() {
      // Calculate total materials cost
      let total = 0;
      materials.forEach(mat => {
        const qty = selections[mat.id] || 0;
        total += mat.price * qty;
      });
      // Store the selected materials and total in localStorage for the booking page
      const selectedMaterials = materials.filter(mat => (selections[mat.id] || 0) > 0).map(mat => ({
        id: mat.id,
        name: mat.name,
        price: mat.price,
        quantity: selections[mat.id]
      }));
      localStorage.setItem('materialSelectionsData', JSON.stringify({
        materials: selectedMaterials,
        total: total
      }));
      // Navigate back to booking page with a flag
      window.location.href = 'booking.html?fromMaterials=true';
    });

    // ── Init ──
    loadMaterials();
  </script>
</body>
</html>
